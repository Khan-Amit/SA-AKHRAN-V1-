<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA-AKHRAN – Sluice Activated Guard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <h1>⚡ SA‑AKHRAN</h1>

    </div>
    <script src="app.js"></script>
</body>
</html>
